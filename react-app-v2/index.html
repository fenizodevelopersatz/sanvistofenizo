    <!-- The original site's favicon was a bug -- it pointed at a WhatsApp promo image
         (wp-content/uploads/2026/03/whatsapp.png) left over from a sale banner. Using the
         dedicated CloneScript "C" mark here instead. This is an SPA
         shell shared by every route, so fixing it here fixes the favicon on all pages at once. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <style>
      /* Pre-React loading indicator: same rocket as src/components/RocketLoader.jsx
         (used by RouteFallback.jsx for lazy route chunks), reimplemented here as
         plain HTML/CSS/SVG since this must render before React or any JS bundle has
         loaded. Prefixed cs-shell-* (distinct from RocketLoader's cs-rocket-loader-*
         classes) to keep the two implementations independent -- this element is
         never touched by React, only ever shown/hidden via the body class below.

         Opaque background is deliberate: this must be the ONLY thing on screen
         while anything is still loading (JS bundle, the first route's lazy
         chunk, that page's own CSS + fonts) -- not the header/footer with an
         invisible content gap behind it. See the closing <script> below for how
         its hide is timed to the same "fully ready" signal that reveals
         .content, instead of React's first paint.

         The ship makes a real bottom-of-screen-to-top-of-screen launch pass (not a
         small in-place sway) -- .cs-shell-rocket-stage is the full-viewport "sky" the
         ship travels through and clips against, while .cs-shell-rocket-sway is
         animated via `top` (a percentage of the stage's own height, so it scales
         correctly at any viewport size) from just below the bottom edge to just
         above the top edge, fading in/out at the extremes so the loop doesn't pop.
         The exhaust puffs live INSIDE the sway element (not the stage) so they
         travel with the ship instead of sitting fixed while the ship flies past
         them -- they'd desync completely under the old small-stage layout. */
      #cs-shell-loader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        background: #fff;
      }

      body.clonescript-page-styles-loading #cs-shell-loader {
        display: block;
      }

      .cs-shell-rocket-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .cs-shell-rocket-sway {
        position: absolute;
        left: 50%;
        width: 96px;
        margin-left: -48px;
        animation: cs-shell-rocket-launch 3.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .cs-shell-rocket-ship {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 14px 20px rgba(16, 27, 72, 0.28));
      }

      @keyframes cs-shell-rocket-launch {
        0%   { top: 108%; transform: translateX(-8px) rotate(-4deg); opacity: 0; }
        6%   { opacity: 1; }
        30%  { transform: translateX(9px) rotate(3deg); }
        50%  { transform: translateX(-9px) rotate(-3deg); }
        70%  { transform: translateX(8px) rotate(3deg); }
        94%  { opacity: 1; }
        100% { top: -34%; transform: translateX(-6px) rotate(-4deg); opacity: 0; }
      }

      .cs-shell-rocket-flame {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: cs-shell-rocket-flicker 0.35s ease-in-out infinite alternate;
      }

      @keyframes cs-shell-rocket-flicker {
        from { transform: scaleY(0.85) scaleX(0.94); opacity: 0.9; }
        to   { transform: scaleY(1.08) scaleX(1.04); opacity: 1; }
      }

      .cs-shell-rocket-puff {
        position: absolute;
        left: 50%;
        top: 18%;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
        animation: cs-shell-rocket-puff 1.1s ease-out infinite;
      }

      .cs-shell-rocket-puff--1 { animation-delay: 0s; }
      .cs-shell-rocket-puff--2 { animation-delay: 0.37s; margin-left: -22px; }
      .cs-shell-rocket-puff--3 { animation-delay: 0.74s; margin-left: 2px; }

      @keyframes cs-shell-rocket-puff {
        0%   { transform: translateY(0) scale(0.6); opacity: 0; }
        15%  { opacity: 0.6; }
        100% { transform: translateY(-70px) scale(1.6); opacity: 0; }
      }

      .cs-shell-loader-label {
        position: absolute;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        color: #101b48;
        font: 600 14px/1.4 system-ui, -apple-system, sans-serif;
      }

      @media (max-width: 767px) {
        .cs-shell-rocket-sway {
          width: 74px;
          margin-left: -37px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cs-shell-rocket-sway {
          top: 50%;
          margin-top: -84px;
          animation: none;
        }
        .cs-shell-rocket-flame { animation: none; }
        .cs-shell-rocket-puff { display: none; }
      }
    </style>

    <!-- Truly global CSS only — verified byte-identical across index.html/contact-us.html/schedule-free-demo.html.
         Per-page bundles (litespeed combined CSS + the page's own -8-/-11-/-12- files) are loaded
         dynamically per route via usePageStylesheets, since those differ page to page.

         shared-eacbef1f.css and shared-713aa8f4.css are ALSO byte-identical across pages, but in the
         original site they load AFTER the per-page litespeed-combined bundle (position varies, but always
         after it) — shared-713aa8f4.css carries the site's real Poppins typography override, cascading
         over the theme's Roboto defaults that live in the litespeed-combined bundle. They must stay out of
         this static head and load at the END of each page's dynamic stylesheet list (see pageStylesheets.js)
         or the theme default (Roboto) wins instead of the intended Poppins everywhere. -->
    <link rel="stylesheet" href="/assets/css/shared-2316490e.css" />
    <link rel="stylesheet" href="/assets/css/shared-174a7427.css" />
    <link rel="stylesheet" href="/assets/css/shared-2477cd65.css" />
    <link rel="stylesheet" href="/assets/css/shared-9d10c24f.css" />
    <link rel="stylesheet" href="/assets/css/shared-09542fd1.css" />
    <link rel="stylesheet" href="/assets/css/shared-a72d889e.css" />
    <link rel="stylesheet" href="/assets/css/shared-1c764d5c.css" />

  <body class="home wp-singular page-template-default page wp-embed-responsive wp-theme-ave theme-ave woocommerce-no-js site-wide-layout wpb-js-composer js-comp-ver-8.7.2 vc_responsive currency-usd clonescript-page-styles-loading" dir="ltr">

      <div class="cs-shell-rocket-stage">
        <div class="cs-shell-rocket-sway">
          <span class="cs-shell-rocket-puff cs-shell-rocket-puff--1"></span>
          <span class="cs-shell-rocket-puff cs-shell-rocket-puff--2"></span>
          <span class="cs-shell-rocket-puff cs-shell-rocket-puff--3"></span>
          <svg class="cs-shell-rocket-ship" viewBox="0 0 120 210" xmlns="http://www.w3.org/2000/svg">
            <defs>

                <stop offset="100%" stop-color="#ff5f6d" />

            </defs>

            <g class="cs-shell-rocket-flame">
              <path d="M60,158 C50,172 46,186 60,206 C74,186 70,172 60,158 Z" fill="url(#cs-shell-rocket-flame-grad)" />
              <path d="M60,160 C55,170 53,180 60,194 C67,180 65,170 60,160 Z" fill="#fff3b0" opacity="0.85" />
            </g>

            <path d="M38,122 L12,160 L38,150 Z" fill="url(#cs-shell-rocket-accent)" />
            <path d="M82,122 L108,160 L82,150 Z" fill="url(#cs-shell-rocket-accent)" />

            <path
              d="M60,8 C46,8 40,34 39,52 L39,140 C39,150 48,158 60,158 C72,158 81,150 81,140 L81,52 C80,34 74,8 60,8 Z"
              fill="#ffffff"

            <!-- Pure-SVG cockpit window (no external image dependency): a plain
                 accent-gradient disc with a hand-drawn "C" mark, standing in for
                 the brand favicon so this element renders before any asset --
                 other than this document itself -- has to load. -->
            <circle cx="60" cy="88" r="20" fill="#101b48" />
            <circle cx="60" cy="88" r="16" fill="url(#cs-shell-rocket-accent)" />
            <path d="M67,80 a10,10 0 1 0 0,16" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
            <circle cx="60" cy="88" r="17" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
            <path d="M50,76 a17,17 0 0 1 10,-5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round" />
          </svg>

      <span class="cs-shell-loader-label">Loading CloneScript experience&hellip;</span>
    </div>
    <div id="root"></div>
    <script>
      // The rocket above must stay up as the ONLY thing on screen for the
      // *entire* first load -- not just until React mounts something. React
      // committing its first paint only means the JS bundle executed; it says
      // nothing about whether the matched route's lazy chunk has arrived or
      // whether that page's own CSS + fonts (usePageStylesheets.js) have
      // loaded. Hiding this early used to leave a gap where the header/footer
      // were visible around a blank, invisible .content placeholder with no
      // rocket at all until those finished.
      //
      // usePageStylesheets.js already tracks exactly that "is anything still
      // loading" state via the `clonescript-page-styles-loading` body class --
      // the same class this file sets by default below, and the same class
      // whose removal is what reveals each page's .content. So this just
      // waits for that class to be removed for the first time, then hides the
      // shell rocket for good, so the CSS rule above and this script always
      // agree on when it's safe to reveal what's underneath.
      //
      // Deliberately one-shot: later in-app route changes re-add this class
      // (see Layout.jsx/expectPageStyles) so the page can be re-hidden while
      // its new stylesheet loads, but that transition already has its own
      // lighter treatment (.content fades in once ready) -- it should not
      // bring back a full-screen rocket every time.
      (function () {
        var loader = document.getElementById('cs-shell-loader')
        if (!loader) return
        function hide() { loader.style.display = 'none' }
        function stillLoading() { return document.body.classList.contains('clonescript-page-styles-loading') }
        if (!stillLoading()) { hide(); return }
        new MutationObserver(function (_, observer) {
          if (!stillLoading()) { hide(); observer.disconnect() }
        }).observe(document.body, { attributes: true, attributeFilter: ['class'] })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
