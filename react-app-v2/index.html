    <style>
      /* Pre-React loading indicator: same rocket as src/components/RocketLoader.jsx
         (used by RouteFallback.jsx for lazy route chunks), reimplemented here as
         plain HTML/CSS/SVG since this must render before React or any JS bundle has
         loaded. Prefixed cs-shell-* (distinct from RocketLoader's cs-rocket-loader-*
         classes) to keep the two implementations independent -- this element is
         never touched by React, only ever shown/hidden via the body class below. */
      #cs-shell-loader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        align-items: center;
        justify-content: center;
      }

      body.clonescript-page-styles-loading #cs-shell-loader {
        display: flex;
      }

      .cs-shell-rocket-stage {
        position: relative;
        width: 140px;
        height: 260px;
        overflow: hidden;
      }

      .cs-shell-rocket-sway {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 96px;
        margin-left: -48px;
        margin-top: -84px;
        animation: cs-shell-rocket-launch 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .cs-shell-rocket-ship {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 14px 20px rgba(16, 27, 72, 0.28));
      }

      @keyframes cs-shell-rocket-launch {
        0%   { transform: translate(-6px, 46%) rotate(-4deg); }
        20%  { transform: translate(8px, 26%) rotate(3deg); }
        40%  { transform: translate(-8px, 6%) rotate(-3deg); }
        60%  { transform: translate(6px, -14%) rotate(2deg); }
        80%  { transform: translate(-6px, -34%) rotate(-3deg); }
        100% { transform: translate(4px, -46%) rotate(2deg); }
      }

      .cs-shell-rocket-flame {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: cs-shell-rocket-flicker 0.35s ease-in-out infinite alternate;
      }

      @keyframes cs-shell-rocket-flicker {
        from { transform: scaleY(0.85) scaleX(0.94); opacity: 0.9; }
        to   { transform: scaleY(1.08) scaleX(1.04); opacity: 1; }
      }

      .cs-shell-rocket-puff {
        position: absolute;
        left: 50%;
        bottom: 18%;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
        animation: cs-shell-rocket-puff 2.6s ease-out infinite;
      }

      .cs-shell-rocket-puff--1 { animation-delay: 0s; }
      .cs-shell-rocket-puff--2 { animation-delay: 0.87s; margin-left: -22px; }
      .cs-shell-rocket-puff--3 { animation-delay: 1.74s; margin-left: 2px; }

      @keyframes cs-shell-rocket-puff {
        0%   { transform: translateY(0) scale(0.6); opacity: 0; }
        15%  { opacity: 0.6; }
        100% { transform: translateY(90px) scale(1.6); opacity: 0; }
      }

      .cs-shell-loader-label {
        position: absolute;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        color: #101b48;
        font: 600 14px/1.4 system-ui, -apple-system, sans-serif;
      }

      @media (max-width: 767px) {
        .cs-shell-rocket-stage {
          width: 110px;
          height: 210px;
        }

        .cs-shell-rocket-sway {
          width: 78px;
          margin-left: -39px;
          margin-top: -68px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cs-shell-rocket-sway { animation: none; }
        .cs-shell-rocket-flame { animation: none; }
        .cs-shell-rocket-puff { display: none; }
      }
    </style>

    <div id="root"></div>
    <script>
      // The rocket above is a plain-HTML stand-in for the moment before React
      // has mounted anything at all. Once React commits its first paint --
      // even just RouteFallback's OWN rocket, while the first route chunk is
      // still loading -- this shell rocket must disappear immediately, or the
      // two render on top of each other (both are the same size/shape, so the
      // duplication was very visible, not a subtle overlap). Watching #root
      // for its first child is the one signal that's true "React has taken
      // over" regardless of which route or how long its chunk takes to load,
      // so this can't race the CSS-bundle-loading class toggle that drives
      // the shell rocket's own visibility.
      (function () {
        var root = document.getElementById('root')
        var loader = document.getElementById('cs-shell-loader')
        if (!root || !loader) return
        function hide() { loader.style.display = 'none' }
        if (root.childNodes.length > 0) { hide(); return }
        new MutationObserver(function (_, observer) {
          if (root.childNodes.length > 0) { hide(); observer.disconnect() }
        }).observe(root, { childList: true })
      })()
    </script>
