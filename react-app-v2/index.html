    <meta charset="UTF-8" />

    <!-- The original site's favicon was a bug -- it pointed at a WhatsApp promo image
         (wp-content/uploads/2026/03/whatsapp.png) left over from a sale banner. Using the
         dedicated CloneScript "C" mark here instead. This is an SPA
         shell shared by every route, so fixing it here fixes the favicon on all pages at once. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/wp-content/uploads/2022/12/Flash-sale.png" fetchpriority="high" />
    <style>
      body.clonescript-page-styles-loading::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 2147483646;
        width: 40px;
        height: 40px;
        margin: -20px;
        border: 4px solid #e7eaf5;
        border-top-color: #0030b8;
        border-radius: 50%;
        animation: clonescript-shell-spin 0.75s linear infinite;
      }

      @keyframes clonescript-shell-spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) {
        body.clonescript-page-styles-loading::before { animation: none; }
      }
    </style>
    <title>CloneScript | Web, Mobile App &amp; Software Development Company</title>
    <meta name="description" content="CloneScript builds websites, mobile apps, SaaS products and ready-to-launch clone scripts for growing businesses. Get in touch to start your project." />
    <link rel="canonical" href="https://example.com/" />

    <!-- OG/Twitter defaults for first paint — src/hooks/useSeo.js overwrites title/description/
         canonical/url per route once React mounts, since this is a client-routed SPA. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloneScript" />
    <meta property="og:title" content="CloneScript | Web, Mobile App &amp; Software Development Company" />
    <meta property="og:description" content="CloneScript builds websites, mobile apps, SaaS products and ready-to-launch clone scripts for growing businesses." />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloneScript | Web, Mobile App &amp; Software Development Company" />
    <meta name="twitter:description" content="CloneScript builds websites, mobile apps, SaaS products and ready-to-launch clone scripts for growing businesses." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CloneScript",
        "url": "https://example.com/",
        "logo": "https://example.com/logo.png",
        "email": "hello@example.com",
        "telephone": "+91-9000000000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Example Street",
          "addressLocality": "Example City",
          "postalCode": "100001",
          "addressRegion": "Example State",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!-- Truly global CSS only — verified byte-identical across index.html/contact-us.html/schedule-free-demo.html.
         Per-page bundles (litespeed combined CSS + the page's own -8-/-11-/-12- files) are loaded
         dynamically per route via usePageStylesheets, since those differ page to page.

         shared-eacbef1f.css and shared-713aa8f4.css are ALSO byte-identical across pages, but in the
         original site they load AFTER the per-page litespeed-combined bundle (position varies, but always
         after it) — shared-713aa8f4.css carries the site's real Poppins typography override, cascading
         over the theme's Roboto defaults that live in the litespeed-combined bundle. They must stay out of
         this static head and load at the END of each page's dynamic stylesheet list (see pageStylesheets.js)
         or the theme default (Roboto) wins instead of the intended Poppins everywhere. -->
    <link rel="stylesheet" href="/assets/css/shared-2316490e.css" />
    <link rel="stylesheet" href="/assets/css/shared-174a7427.css" />
    <link rel="stylesheet" href="/assets/css/shared-2477cd65.css" />
    <link rel="stylesheet" href="/assets/css/shared-9d10c24f.css" />
    <link rel="stylesheet" href="/assets/css/shared-09542fd1.css" />
    <link rel="stylesheet" href="/assets/css/shared-a72d889e.css" />
    <link rel="stylesheet" href="/assets/css/shared-1c764d5c.css" />
    <link rel="stylesheet" href="/assets/vendor/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="/assets/fonts/google-fonts.css" />
  </head>
